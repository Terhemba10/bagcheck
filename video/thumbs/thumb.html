<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Covex thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; background: #000; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", sans-serif; color: #f2f2f2; position: relative; }
  .glow-bg { position: absolute; inset: 0; background: radial-gradient(60% 70% at 78% 55%, rgba(62,230,200,.16), transparent 70%); }
  .brand { position: absolute; left: 56px; top: 44px; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; letter-spacing: -.01em; }
  .brand svg { width: 52px; height: 52px; }
  h1 { position: absolute; font-weight: 900; letter-spacing: -.035em; line-height: .96; }
  .accent { color: #3ee6c8; }
  .red { color: #ff8094; }
  .shot { position: absolute; border-radius: 20px; overflow: hidden; border: 2px solid rgba(62,230,200,.55);
          box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 0 60px 6px rgba(62,230,200,.35), 0 40px 80px -20px #000; background: #000; }
  .shot img { display: block; width: 100%; }
  .chip { position: absolute; left: 56px; bottom: 44px; font-weight: 600; font-size: 22px; color: #a1a1a1;
          border: 1.5px solid rgba(255,255,255,.18); border-radius: 999px; padding: 10px 20px; background: #0a0a0a; }
  /* A: Did they keep their promises? */
  .a h1 { left: 56px; top: 150px; font-size: 108px; width: 640px; }
  .a .shot { right: 56px; top: 56px; width: 470px; transform: perspective(1400px) rotateY(-9deg) rotateX(2deg); transform-origin: 100% 50%; }
  /* B: Check before you buy */
  .b h1 { left: 56px; top: 128px; font-size: 118px; width: 1180px; }
  .b .shot { left: 56px; right: 56px; top: 400px; height: 300px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .b .shot img { width: 100%; }
  .b .chip { left: auto; right: 56px; top: 52px; bottom: auto; }
  /* C: Can you still get out? */
  .c h1 { left: 56px; top: 170px; font-size: 112px; width: 660px; }
  .c .shot { right: 70px; top: 56px; width: 450px; transform: rotate(3deg); }
</style>
</head>
<body>
<div class="glow-bg"></div>
<div class="brand">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M27.26 9.5 16 3 4.74 9.5v13L16 29l11.26-6.5" fill="none" stroke="#e6e6e6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.6" cy="16" r="7" fill="#3ee6c8" fill-opacity=".16"/><path d="M17.6 11.2l4.16 2.4v4.8l-4.16 2.4-4.16-2.4v-4.8z" fill="#3ee6c8"/></svg>
  Covex
</div>
<main id="root"></main>
<script>
  const v = new URLSearchParams(location.search).get("v") || "a";
  const root = document.getElementById("root");
  document.body.classList.add(v);
  const chip = '<div class="chip">Built on the CoinMarketCap API</div>';
  if (v === "a") root.innerHTML = '<h1>Did they keep their <span class="accent">promises?</span></h1><div class="shot"><img src="../out/thumb-aside.png" alt=""></div>' + chip;
  if (v === "b") root.innerHTML = '<h1>Check before<br><span class="accent">you buy</span></h1><div class="shot"><img src="../out/thumb-wide.png" alt=""></div>' + chip;
  if (v === "c") root.innerHTML = '<h1>Can you still <span class="red">get out?</span></h1><div class="shot"><img src="../out/thumb-aside.png" alt=""></div>' + chip;
</script>
</body>
</html>
